name: Build Unsigned IPA

on:
  workflow_dispatch:      # bấm nút "Run workflow" thủ công trên GitHub
    inputs:
      scheme:
        description: 'Tên scheme trong Xcode project'
        required: true
        default: 'ThreeOneOSFive'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods dependencies (nếu có Podfile)
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update
          else
            echo "Không có Podfile, bỏ qua bước này"
          fi

      - name: List available schemes (debug)
        run: |
          xcodebuild -list || true
          if [ -f "*.xcworkspace" ]; then xcodebuild -list -workspace *.xcworkspace; fi

      - name: Archive project
        run: |
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            xcodebuild archive \
              -workspace $(ls *.xcworkspace | head -1) \
              -scheme "${{ github.event.inputs.scheme }}" \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild archive \
              -project $(ls *.xcodeproj | head -1) \
              -scheme "${{ github.event.inputs.scheme }}" \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/unsigned.ipa
